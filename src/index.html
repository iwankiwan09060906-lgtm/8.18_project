<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | endpointproject</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="page-title">
        <div class="brand" aria-hidden="true">E</div>
        <div class="heading">
          <h1 id="page-title">환영합니다</h1>
          <p>계정에 로그인하거나 새 계정을 만들어 주세요.</p>
        </div>
        <div class="tabs" role="tablist" aria-label="계정 메뉴">
          <button class="tab is-active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">로그인</button>
          <button class="tab" id="signup-tab" type="button" role="tab" aria-selected="false" aria-controls="signup-panel">회원가입</button>
        </div>
        <form class="auth-form" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
          <label for="login-email">이메일</label>
          <input id="login-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />
          <div class="label-row">
            <label for="login-password">비밀번호</label>
            <a href="#">비밀번호 찾기</a>
          </div>
          <div class="password-field">
            <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" minlength="8" required />
            <button class="password-toggle" type="button" aria-label="비밀번호 표시">보기</button>
          </div>
          <label class="check-row"><input name="remember" type="checkbox" /><span>로그인 상태 유지</span></label>
          <button class="submit-button" type="submit">로그인</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
        <form class="auth-form" id="signup-panel" role="tabpanel" aria-labelledby="signup-tab" hidden>
          <label for="signup-name">이름</label>
          <input id="signup-name" name="name" type="text" placeholder="이름을 입력하세요" autocomplete="name" required />
          <label for="signup-email">이메일</label>
          <input id="signup-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />
          <label for="signup-password">비밀번호</label>
          <div class="password-field">
            <input id="signup-password" name="password" type="password" placeholder="8자 이상 입력하세요" autocomplete="new-password" minlength="8" required />
            <button class="password-toggle" type="button" aria-label="비밀번호 표시">보기</button>
          </div>
          <label class="check-row"><input name="terms" type="checkbox" required /><span><a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의합니다.</span></label>
          <button class="submit-button" type="submit">계정 만들기</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="./js/commom.js"></script>
  </body>
</html>
