<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>로그인</h2>
      <form id="loginForm">
        <div>
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            required
            placeholder="example@email.com"
          />
        </div>
        <div>
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            required
            placeholder="비밀번호 입력"
          />
        </div>
        <button type="submit">로그인</button>
      </form>
    </div>

    <script src="js/common.js"></script>
  </body>
</html>
